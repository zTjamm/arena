<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арена — просмотрщик ботов</title>
<style>
    :root {
        --bg: #0c111c;
        --panel: rgba(255, 255, 255, 0.055);
        --border: rgba(255, 255, 255, 0.12);
        --text: #e8f0ff;
        --dim: rgba(232, 240, 255, 0.55);
        --accent: #4da3ff;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #field {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    .panel {
        position: absolute;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        padding: 10px 14px;
    }

    #stats {
        top: 14px;
        left: 14px;
        min-width: 210px;
    }

    #stats h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.02em;
    }

    #stats .row {
        color: var(--dim);
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
    }

    #stats .row b { color: var(--text); font-weight: 600; }

    #feed {
        top: 14px;
        right: 14px;
        width: 250px;
        max-height: 46vh;
        overflow: hidden;
    }

    #feed h2 {
        margin: 0 0 7px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--dim);
    }

    #feed ol {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 12.5px;
    }

    #feed li {
        padding: 3px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        gap: 7px;
        align-items: baseline;
        animation: pop 0.18s ease-out;
    }

    #feed li:first-child { border-top: 0; }

    #feed .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        flex: 0 0 auto;
    }

    #feed .txt { flex: 1 1 auto; color: var(--text); }
    #feed .txt span { color: var(--dim); }
    #feed .place {
        flex: 0 0 auto;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
    }

    @keyframes pop {
        from { opacity: 0; transform: translateY(-4px); }
        to   { opacity: 1; transform: none; }
    }

    #controls {
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100vw - 28px);
    }

    .group {
        display: flex;
        gap: 5px;
        align-items: center;
    }

    .group .label {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        margin-right: 3px;
    }

    button {
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 11px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s;
    }

    button:hover { background: rgba(255, 255, 255, 0.13); }
    button.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #06101f;
        font-weight: 600;
    }

    .check {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        color: var(--dim);
        cursor: pointer;
        user-select: none;
    }
    .check input { accent-color: var(--accent); }

    #hint {
        position: absolute;
        bottom: 74px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(232, 240, 255, 0.32);
        font-size: 12px;
        pointer-events: none;
        text-align: center;
        white-space: nowrap;
    }

    @media (max-width: 720px) {
        #feed { display: none; }
        #hint { display: none; }
        #stats { min-width: 0; }
    }
</style>
</head>
<body>

<canvas id="field"></canvas>

<section class="panel" id="stats">
    <h1>Арена · просмотрщик ботов</h1>
    <div class="row" id="line1">—</div>
    <div class="row" id="line2">—</div>
</section>

<section class="panel" id="feed">
    <h2>Кто вылетел</h2>
    <ol id="feedList"></ol>
</section>

<div id="hint">Пробел — пауза · R — новая партия</div>

<footer class="panel" id="controls">
    <div class="group">
        <span class="label">Ботов</span>
        <span id="countBtns"></span>
    </div>
    <div class="group">
        <span class="label">Темп</span>
        <span id="speedBtns"></span>
    </div>
    <div class="group">
        <button id="pauseBtn">Пауза</button>
        <button id="restartBtn">Новая партия</button>
    </div>
    <label class="check">
        <input type="checkbox" id="marginCheck">
        остаток до края
    </label>
</footer>

<!-- Пути относительные: страница должна работать и в корне, и по
     пути /arena/, не залезая при этом в корень чужой игры. -->
<script src="bundle.js"></script>
<script src="viewer.js"></script>
</body>
</html>
